name: siber

services:
  siber:
    build:
      context: .
      dockerfile: docker/allinone/Dockerfile
    container_name: siber
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siber_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-siber}
      DATABASE_URL: postgresql://${POSTGRES_USER:-siber}:${POSTGRES_PASSWORD:-siber_dev_password}@localhost:5432/${POSTGRES_DB:-siber}?schema=public
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3001:80"      # app (nginx: frontend + proxy /api → backend:3005)
      - "5433:5432"    # postgres (mismo puerto externo de siempre)
    volumes:
      - siber-pgdata:/var/lib/postgresql/data

volumes:
  siber-pgdata:
